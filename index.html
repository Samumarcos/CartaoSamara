<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Samara Costa | Advocacia Imobiliária</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  --page:#000; --card:#fff; --ink:#1c1c1c; --soft:#666; --line:#e8e8e8; --mint:#00D4AA;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#000}}
:root[data-theme="dark"]{--page:#000}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.4 Arial,Helvetica,sans-serif;display:flex;justify-content:center;padding:14px 12px 28px;min-height:100vh}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:14px}
.hero{container-type:inline-size;position:relative;border-radius:20px;overflow:hidden;min-height:520px;display:flex;flex-direction:column;justify-content:flex-end;padding:26px 18px 24px;color:#fff;
  background:radial-gradient(120% 80% at 70% 15%,#14305f 0%,#09132B 55%,#050b1a 100%);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.hero .photo{position:absolute;inset:0;background-size:cover;background-position:center top}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 38%,rgba(0,0,0,.55) 62%,#000 100%)}
.hero>*:not(.photo){position:relative;z-index:1}
h1{margin:0;font-weight:400;font-size:46px;line-height:1.05;letter-spacing:-.01em}
.sub{margin:14px 0 0;font-size:22px}
.tag{margin:16px 0 0;font-size:11px;font-size:min(16px,3.05cqw);font-weight:700;line-height:1.3;white-space:nowrap}
.logo{display:block;align-self:flex-start;flex:none;margin-top:22px;height:56px;width:auto;object-fit:contain}
.panel{background:var(--card);border-radius:24px;padding:22px 24px 26px}
.ph{display:flex;align-items:center;gap:16px;padding-bottom:22px;border-bottom:1px dashed var(--line)}
.dot{width:52px;height:52px;border-radius:50%;background:#000;display:grid;place-items:center;color:#fff;flex:none}
.dot svg{width:24px;height:24px}
.ph h2{margin:0;font-weight:400;font-size:22px;color:#333}
.item{display:block;margin-top:22px;text-decoration:none;color:inherit}
.item b{display:block;font-weight:400;font-size:23px;color:#222}
.item span{display:block;font-size:15px;color:var(--soft);overflow-wrap:anywhere}
a.item:focus-visible,.save:focus-visible{outline:3px solid var(--mint);outline-offset:3px;border-radius:6px}
.save{margin-top:28px;width:100%;border:0;border-radius:999px;background:#000;color:#fff;font:500 17px Arial,Helvetica,sans-serif;padding:16px;min-height:54px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
.save:hover{background:#1a1a1a}
</style>
</head>
